server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # Resolve the API on each request (deploys briefly run two API containers and then
  # remove the old one) and try the other container when a connection fails.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $booking_api booking-api:8080;
  location /api/ { proxy_pass http://$booking_api; proxy_next_upstream error timeout; proxy_next_upstream_tries 3; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 2s; proxy_read_timeout 30s; }
  location / { try_files $uri $uri/ /index.html; }
}
